server:
  port: 8087

spring:
  application:
    name: exp-bid-contract
  servlet:
    multipart:
      # 附件上传大小限制（避免大文件上传时报 413/超限）
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://192.168.101.128:3306/expdb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.101.128
      port: 6379
      password: redis123456
      database: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.101.128:8848
        username: nacos
        password: nacos

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.exp: debug

#引入外部服务
exp:
  service:
    auth:
      url: http://exp-auth
    corp:
      url: http://exp-corp
    project:
      url: http://exp-project
    sys:
      url: http://exp-sys

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/*.xml
  # 使用数据库自增主键，避免全局默认的雪花算法覆盖实体上的 IdType.AUTO
  global-config:
    db-config:
      id-type: auto