server:
  port: 8088
  tomcat:
    # 默认表单 POST 解析上限约 2MB，multipart 场景可能触发 413
    max-http-form-post-size: 500MB

spring:
  application:
    name: exp-sys
  servlet:
    multipart:
      # 与调用方保持一致，避免服务间转发时在存储服务侧被拦截
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://192.168.101.128:3306/expdb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.101.128
      port: 6379
      password: redis123456
      database: 0
  jpa:
    hibernate:
      # 开发阶段自动建表/更新表结构，生产环境改为 validate
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # SQL 脚本执行已禁用，使用 DataInitializer 类进行数据初始化
  # sql:
  #   init:
  #     mode: always
  #     data-locations: classpath:data.sql
  #     continue-on-error: true
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.101.128:8848
        username: nacos
        password: nacos

exp:
  service:
    auth:
      url: http://exp-auth
  storage:
    s3:
      endpoint: http://192.168.101.128:9000
      region: us-east-1
      access-key: rustfsadmin
      secret-key: rustfsadmin
      bucket: my-bucket
      force-path-style: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.exp: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/*.xml
  # 使用数据库自增主键，避免全局默认的雪花算法覆盖实体上的 IdType.AUTO
  global-config:
    db-config:
      id-type: auto