server:
  port: 9000

spring:
  application:
    name: exp-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.101.128:8848
        username: nacos
        password: nacos
    gateway:
      # 关闭自动路由（不使用默认的 /service-name/** 路由规则）
      discovery:
        locator:
          enabled: false
      # CORS 跨域配置（解决浏览器跨域问题，OPTIONS 预检请求必须包含）
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600
      # 路由配置：将请求转发到不同的微服务（lb:// 表示负载均衡，从 Nacos 获取服务实例）
      routes:
        - id: auth-service
          uri: lb://exp-auth
          predicates:
            - Path=/exp/auth/**
          filters:
            # 外部统一以 /exp/auth/** 访问；下游 exp-auth 服务实际暴露的是 /**（例如 /roles/menus）
            # 因此需要去掉前两段前缀：/exp/auth
            - StripPrefix=2

        - id: sys-service
          uri: lb://exp-sys
          predicates:
            - Path=/exp/sys/**
          filters:
            - StripPrefix=2

        - id: bid-service
          uri: lb://exp-bid-contract-service
          predicates:
            - Path=/exp/bid/**
          filters:
            - StripPrefix=2

        - id: contracts-service
          uri: lb://exp-bid-contract-service
          predicates:
            - Path=/exp/contracts/**
          filters:
            - StripPrefix=2

        - id: project-service
          uri: lb://exp-project-service
          predicates:
            - Path=/exp/project/**
          filters:
            - StripPrefix=2

        - id: corp-service
          uri: lb://exp-corp-service
          predicates:
            - Path=/exp/corp/**
          filters:
            - StripPrefix=2
  data:
    redis:
      host: 192.168.101.128
      port: 6379
      password: redis123456

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 日志级别配置（默认 root=INFO 不会输出 debug；这里仅为网关鉴权相关开启 DEBUG）
logging:
  level:
    root: INFO
    jh.exp.gateway.auth.filter: DEBUG

# JWT Token 配置
exp:
  gateway:
    jwt:
      secret: exp-secret
      expire-minutes: 120

